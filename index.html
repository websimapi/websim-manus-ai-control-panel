<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manus AI Control Panel</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
    }
    .navbar {
      background-color: #343a40;
    }
    .sidebar {
      height: calc(100vh - 56px);
      background-color: #343a40;
      color: white;
      padding: 20px;
    }
    .main-content {
      padding: 20px;
      height: calc(100vh - 56px);
      overflow-y: auto;
    }
    .card {
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .log-container {
      height: 300px;
      overflow-y: auto;
      background-color: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
      font-family: monospace;
    }
    .message {
      padding: 5px 10px;
      margin-bottom: 5px;
      border-radius: 5px;
    }
    .message.system {
      background-color: #d1e7dd;
    }
    .message.user {
      background-color: #cfe2ff;
    }
    .message.error {
      background-color: #f8d7da;
    }
    #connectionIndicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }
    .connection-online {
      background-color: #28a745;
    }
    .connection-offline {
      background-color: #dc3545;
    }
    .nav-link {
      color: rgba(255,255,255,.75);
      cursor: pointer;
    }
    .nav-link:hover, .nav-link.active {
      color: rgba(255,255,255,1);
    }
    .console-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .console-input {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const App = () => {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [connected, setConnected] = useState(false);
      const [logs, setLogs] = useState([]);
      const [systemInfo, setSystemInfo] = useState({
        cpu: 0,
        memory: 0,
        uptime: 0,
      });
      const [consoleInput, setConsoleInput] = useState('');
      const [tasks, setTasks] = useState([]);
      const [websocketUrl, setWebsocketUrl] = useState('');
      const socketRef = useRef(null);
      const logContainerRef = useRef(null);

      useEffect(() => {
        if (logContainerRef.current) {
          logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
        }
      }, [logs]);

      const connectWebSocket = () => {
        if (!websocketUrl) return;
        
        try {
          const socket = new WebSocket(websocketUrl);
          socketRef.current = socket;
          
          socket.onopen = () => {
            setConnected(true);
            addLog('System', 'WebSocket connection established');
          };
          
          socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'systemInfo') {
              setSystemInfo(data.payload);
            } else if (data.type === 'task') {
              updateTasks(data.payload);
            } else {
              addLog(data.sender || 'Server', data.message);
            }
          };
          
          socket.onclose = () => {
            setConnected(false);
            addLog('System', 'WebSocket connection closed', true);
          };
          
          socket.onerror = (error) => {
            setConnected(false);
            addLog('System', `WebSocket error: ${error.message}`, true);
          };
        } catch (error) {
          addLog('System', `Error connecting to WebSocket: ${error.message}`, true);
        }
      };

      const disconnectWebSocket = () => {
        if (socketRef.current) {
          socketRef.current.close();
          socketRef.current = null;
          setConnected(false);
          addLog('System', 'WebSocket connection closed');
        }
      };

      const addLog = (sender, message, isError = false) => {
        setLogs(prevLogs => [...prevLogs, { 
          id: Date.now(), 
          timestamp: new Date().toLocaleTimeString(), 
          sender, 
          message, 
          type: isError ? 'error' : sender === 'System' ? 'system' : 'user' 
        }]);
      };

      const updateTasks = (task) => {
        setTasks(prevTasks => {
          // Check if the task already exists
          const existingTaskIndex = prevTasks.findIndex(t => t.id === task.id);
          
          if (existingTaskIndex >= 0) {
            // Update existing task
            const newTasks = [...prevTasks];
            newTasks[existingTaskIndex] = task;
            return newTasks;
          } else {
            // Add new task
            return [...prevTasks, task];
          }
        });
      };

      const sendCommand = () => {
        if (!socketRef.current || socketRef.current.readyState !== WebSocket.OPEN) {
          addLog('System', 'WebSocket is not connected', true);
          return;
        }
        
        try {
          socketRef.current.send(JSON.stringify({ 
            type: 'command', 
            command: consoleInput 
          }));
          addLog('You', consoleInput);
          setConsoleInput('');
        } catch (error) {
          addLog('System', `Error sending message: ${error.message}`, true);
        }
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter') {
          sendCommand();
        }
      };

      return (
        <div>
          <nav className="navbar navbar-dark">
            <div className="container-fluid">
              <a className="navbar-brand">Manus AI Control Panel</a>
              <div className="d-flex align-items-center">
                <span id="connectionIndicator" className={connected ? "connection-online" : "connection-offline"}></span>
                <span className="text-light">{connected ? "Connected" : "Disconnected"}</span>
              </div>
            </div>
          </nav>
          
          <div className="container-fluid">
            <div className="row">
              <div className="col-md-2 sidebar">
                <nav className="nav flex-column">
                  <a className={`nav-link ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>Dashboard</a>
                  <a className={`nav-link ${activeTab === 'logs' ? 'active' : ''}`} onClick={() => setActiveTab('logs')}>Logs</a>
                  <a className={`nav-link ${activeTab === 'console' ? 'active' : ''}`} onClick={() => setActiveTab('console')}>Console</a>
                  <a className={`nav-link ${activeTab === 'tasks' ? 'active' : ''}`} onClick={() => setActiveTab('tasks')}>Tasks</a>
                  <a className={`nav-link ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}>Settings</a>
                </nav>
              </div>
              
              <div className="col-md-10 main-content">
                {activeTab === 'dashboard' && (
                  <div>
                    <h2>System Overview</h2>
                    <div className="row">
                      <div className="col-md-4">
                        <div className="card">
                          <div className="card-body">
                            <h5 className="card-title">CPU Usage</h5>
                            <h1 className="card-text">{systemInfo.cpu}%</h1>
                          </div>
                        </div>
                      </div>
                      <div className="col-md-4">
                        <div className="card">
                          <div className="card-body">
                            <h5 className="card-title">Memory Usage</h5>
                            <h1 className="card-text">{systemInfo.memory}%</h1>
                          </div>
                        </div>
                      </div>
                      <div className="col-md-4">
                        <div className="card">
                          <div className="card-body">
                            <h5 className="card-title">Uptime</h5>
                            <h1 className="card-text">{systemInfo.uptime}h</h1>
                          </div>
                        </div>
                      </div>
                    </div>
                    
                    <h2 className="mt-4">Recent Activity</h2>
                    <div className="log-container" ref={logContainerRef}>
                      {logs.slice(-5).map((log) => (
                        <div key={log.id} className={`message ${log.type}`}>
                          <strong>{log.timestamp} [{log.sender}]:</strong> {log.message}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                
                {activeTab === 'logs' && (
                  <div>
                    <h2>System Logs</h2>
                    <div className="log-container" ref={logContainerRef}>
                      {logs.map((log) => (
                        <div key={log.id} className={`message ${log.type}`}>
                          <strong>{log.timestamp} [{log.sender}]:</strong> {log.message}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                
                {activeTab === 'console' && (
                  <div>
                    <h2>Command Console</h2>
                    <div className="console-container">
                      <div className="log-container" ref={logContainerRef}>
                        {logs.map((log) => (
                          <div key={log.id} className={`message ${log.type}`}>
                            <strong>{log.timestamp} [{log.sender}]:</strong> {log.message}
                          </div>
                        ))}
                      </div>
                      <div className="console-input">
                        <input 
                          type="text" 
                          className="form-control" 
                          placeholder="Enter command..." 
                          value={consoleInput}
                          onChange={(e) => setConsoleInput(e.target.value)}
                          onKeyPress={handleKeyPress}
                          disabled={!connected}
                        />
                        <button 
                          className="btn btn-primary" 
                          onClick={sendCommand}
                          disabled={!connected || !consoleInput.trim()}
                        >
                          Send
                        </button>
                      </div>
                    </div>
                  </div>
                )}
                
                {activeTab === 'tasks' && (
                  <div>
                    <h2>Active Tasks</h2>
                    <div className="table-responsive">
                      <table className="table table-striped">
                        <thead>
                          <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th>Created</th>
                          </tr>
                        </thead>
                        <tbody>
                          {tasks.length > 0 ? (
                            tasks.map(task => (
                              <tr key={task.id}>
                                <td>{task.id}</td>
                                <td>{task.name}</td>
                                <td>
                                  <span className={`badge ${
                                    task.status === 'completed' ? 'bg-success' : 
                                    task.status === 'failed' ? 'bg-danger' : 
                                    task.status === 'in_progress' ? 'bg-primary' : 'bg-secondary'
                                  }`}>
                                    {task.status}
                                  </span>
                                </td>
                                <td>
                                  <div className="progress">
                                    <div 
                                      className="progress-bar" 
                                      role="progressbar" 
                                      style={{width: `${task.progress || 0}%`}} 
                                      aria-valuenow={task.progress || 0} 
                                      aria-valuemin="0" 
                                      aria-valuemax="100"
                                    >
                                      {task.progress || 0}%
                                    </div>
                                  </div>
                                </td>
                                <td>{new Date(task.createdAt).toLocaleString()}</td>
                              </tr>
                            ))
                          ) : (
                            <tr>
                              <td colSpan="5" className="text-center">No active tasks</td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
                
                {activeTab === 'settings' && (
                  <div>
                    <h2>Connection Settings</h2>
                    <div className="card">
                      <div className="card-body">
                        <div className="mb-3">
                          <label htmlFor="websocketUrl" className="form-label">WebSocket URL</label>
                          <input 
                            type="text" 
                            className="form-control" 
                            id="websocketUrl" 
                            placeholder="ws://localhost:8080" 
                            value={websocketUrl}
                            onChange={(e) => setWebsocketUrl(e.target.value)}
                          />
                        </div>
                        <div className="d-flex gap-2">
                          <button 
                            className="btn btn-primary" 
                            onClick={connectWebSocket}
                            disabled={connected || !websocketUrl}
                          >
                            Connect
                          </button>
                          <button 
                            className="btn btn-danger" 
                            onClick={disconnectWebSocket}
                            disabled={!connected}
                          >
                            Disconnect
                          </button>
                        </div>
                      </div>
                    </div>
                    
                    <h2 className="mt-4">About</h2>
                    <div className="card">
                      <div className="card-body">
                        <h5 className="card-title">Manus AI Control Panel</h5>
                        <p className="card-text">
                          This control panel allows you to manage and interact with your Manus AI server.
                          Connect to your server using the WebSocket URL above to monitor system status,
                          view logs, and execute commands.
                        </p>
                        <p className="card-text">
                          <small className="text-muted">
                            Source: <a href="https://gist.github.com/jlia0/db0a9695b3ca7609c9b1a08dcbf872c9" target="_blank">
                              https://gist.github.com/jlia0/db0a9695b3ca7609c9b1a08dcbf872c9
                            </a>
                          </small>
                        </p>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
